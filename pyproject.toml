[project]
name = "fieldledger"
version = "0.1.0"
description = "Offline-capable construction change control"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mcp>=1.13,<2",
  "pydantic>=2.11,<3",
  "pypdf>=5,<7",
  "python-docx>=1.2,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "hypothesis>=6.138,<7",
  "mcp[cli]>=1.13,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fieldledger"
module-root = "apps/api/src"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore:Field 'lifespan' has an incomplete definition:pydantic_settings.exceptions.IncompleteFieldDefinitionWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fieldledger"]
mypy_path = "apps/api/src"

[project.scripts]
fieldledger-api = "fieldledger.main:run"
fieldledger-worker = "fieldledger.worker:run"
fieldledger-watcher = "fieldledger.watcher:run"
fieldledger-mcp = "fieldledger.mcp_server:run"
